
name: Build Camera Plus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # SDK tools install kare; license prompt yahan disable hai
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      # License agreements ko non-interactive tarike se accept kare
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -o pipefail
          yes | sdkmanager --licenses

      # Required SDK components install kare
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-35"

      - name: Build debug APK
        run: |
          gradle --version
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Plus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
