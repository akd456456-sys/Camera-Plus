
name: Build Camera Plus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Accept SDK licenses safely
        shell: bash
        run: |
          set +e
          set +o pipefail

          yes | sdkmanager --licenses
          sdk_status=${PIPESTATUS[1]}

          set -e
          set -o pipefail

          if [ "$sdk_status" -ne 0 ]; then
            echo "sdkmanager license acceptance failed."
            exit "$sdk_status"
          fi

          echo "sdkmanager license command completed successfully."

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set +e
          set +o pipefail

          yes | sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          sdk_status=${PIPESTATUS[1]}

          set -e
          set -o pipefail

          if [ "$sdk_status" -ne 0 ]; then
            echo "SDK package installation failed."
            exit "$sdk_status"
          fi

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build debug APK
        run: |
          gradle --version
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Camera-Plus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
